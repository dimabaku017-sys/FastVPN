<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e; /* Темный фон */
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background-color: #2c2c2e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .card p {
            margin: 0;
            color: #aeaeb2;
            font-size: 14px;
        }
        .btn {
            background-color: #0a84ff; /* Синий цвет */
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .bottom-nav {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            background-color: #2c2c2e;
            padding: 10px 0;
            border-radius: 20px;
        }
        .nav-item {
            text-align: center;
            color: #aeaeb2;
            font-size: 12px;
        }
        .nav-item.active {
            color: #0a84ff;
        }
        .nav-icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FastVPN</h1>
    </div>

    <div class="card">
        <h2>Ваш статус</h2>
        <p>Подписка активна до: <span style="color: #32d74b;">10.12.2026</span></p>
    </div>

    <div class="card">
        <h2>Трафик</h2>
        <p>Использовано: 0 МБ из 15 ГБ</p>
    </div>

    <button class="btn" onclick="buySubscription()">Купить подписку</button>

    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            Главная
        </div>
        <div class="nav-item">
            <span class="nav-icon">🛒</span>
            Подписка
        </div>
        <div class="nav-item">
            <span class="nav-icon">💳</span>
            Баланс
        </div>
        <div class="nav-item">
            <span class="nav-icon">👥</span>
            Рефералы
        </div>
        <div class="nav-item">
            <span class="nav-icon">💬</span>
            Поддержка
        </div>
    </div>

    <script>
        // Инициализация Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Функция для кнопки покупки
        function buySubscription() {
            tg.showAlert("Перенаправление в чат с ботом для покупки...");
            // Закрываем Web App и возвращаемся в чат
            tg.close();
            // Здесь можно добавить отправку данных в бота
        }
    </script>
</body>
</html>
