<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FastVPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ГЛАВНАЯ -->
    <div id="tab-main">
        <h1 style="margin-bottom:20px;">Главная</h1>
        
        <div class="card">
            <div class="card-row">
                <div>
                    <div class="card-title">Ваша подписка</div>
                    <div class="big-text" id="sub-days">0 дней</div>
                    <div class="sub-text" id="sub-date">Нет активной подписки</div>
                </div>
                <div class="status-badge" id="sub-status">Ожидание</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Трафик</div>
            <div class="card-row" style="align-items: baseline;">
                <div class="big-text" id="traffic-percent">0%</div>
                <div class="sub-text" id="traffic-text">0 МБ / 15 ГБ</div>
            </div>
            <div class="progress-bg"><div class="progress-fill" id="traffic-bar"></div></div>
        </div>

        <button class="btn btn-main" onclick="showTab('sub')">Купить подписку</button>
    </div>

    <!-- ПОДПИСКА -->
    <div id="tab-sub" class="hidden">
        <h1 style="margin-bottom:20px;">Тарифы</h1>
        <div class="card" onclick="sendCommandToBot('buy', {plan: '1m', price: 80})">
            <div class="card-row" style="align-items: center;">
                <div><div style="font-weight:600; font-size:18px;">1 месяц</div></div>
                <div style="font-size:20px; font-weight:700;">80 ₽</div>
            </div>
        </div>
        <div class="card" onclick="sendCommandToBot('buy', {plan: '3m', price: 200})" style="border: 1px solid var(--accent);">
            <div class="card-row" style="align-items: center;">
                <div><div style="font-weight:600; font-size:18px;">3 месяца</div></div>
                <div style="font-size:20px; font-weight:700;">200 ₽</div>
            </div>
        </div>
        <div class="card" onclick="sendCommandToBot('buy', {plan: '12m', price: 700})">
            <div class="card-row" style="align-items: center;">
                <div><div style="font-weight:600; font-size:18px;">12 месяцев</div></div>
                <div style="font-size:20px; font-weight:700;">700 ₽</div>
            </div>
        </div>
    </div>

    <!-- БАЛАНС (Промокод) -->
    <div id="tab-balance" class="hidden">
        <h1 style="margin-bottom:20px;">Промокод</h1>
        <div class="card">
            <input type="text" id="promo-input" placeholder="Введите промокод">
            <button class="btn btn-red" onclick="applyPromo()">Активировать</button>
        </div>
    </div>

    <!-- РЕФЕРАЛЫ -->
    <div id="tab-ref" class="hidden">
        <h1 style="margin-bottom:20px;">Рефералы</h1>
        <div class="card">
            <div class="card-title">Приглашено человек</div>
            <div class="big-text" id="ref-count">0</div>
        </div>
        
        <div class="card" id="coupon-card" style="display:none; border-color: var(--accent);">
            <div class="card-title" style="color: var(--accent);">🎁 Доступен купон на 50 ₽</div>
            <button class="btn btn-main" style="margin-top:10px;" onclick="sendCommandToBot('activate_coupon')">Активировать скидку</button>
        </div>

        <div class="card">
            <div class="card-title">Ваша ссылка</div>
            <input type="text" value="https://t.me/FastVPN_Net_bot?start=ref_123456" readonly id="ref-link">
            <button class="btn btn-copy" onclick="copyLink()">📋 Копировать</button>
        </div>
    </div>

    <!-- ПОДДЕРЖКА -->
    <div id="tab-support" class="hidden">
        <h1 style="margin-bottom:20px;">Поддержка</h1>
        <div class="card">
            <textarea id="support-text" style="width:100%; height:100px; background:#232f29; border:1px solid #2a362f; border-radius:12px; color:white; padding:10px; outline:none;" placeholder="Опишите проблему..."></textarea>
            <button class="btn btn-main" style="margin-top:15px;" onclick="sendSupport()">Отправить</button>
        </div>
    </div>

    <!-- МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-main" onclick="showTab('main')"><span class="nav-icon">🏠</span>Главная</div>
        <div class="nav-item" id="nav-sub" onclick="showTab('sub')"><span class="nav-icon">🛒</span>Подписка</div>
        <div class="nav-item" id="nav-balance" onclick="showTab('balance')"><span class="nav-icon">💳</span>Промокод</div>
        <div class="nav-item" id="nav-ref" onclick="showTab('ref')"><span class="nav-icon">👥</span>Рефералы</div>
        <div class="nav-item" id="nav-support" onclick="showTab('support')"><span class="nav-icon">💬</span>Поддержка</div>
    </div>

    <script src="data.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#0f1713');

        // Рендер данных при загрузке
        document.addEventListener("DOMContentLoaded", () => {
            if (userData.isActive) {
                document.getElementById('sub-days').innerText = userData.daysLeft + " дня";
                document.getElementById('sub-date').innerText = "до " + userData.dateEnd;
                document.getElementById('sub-status').innerText = "Активна";
            } else {
                document.getElementById('sub-days').innerText = "0 дней";
                document.getElementById('sub-date').innerText = "Нет подписки";
                document.getElementById('sub-status').innerText = "Не активна";
                document.getElementById('sub-status').classList.add('inactive');
            }

            let percent = Math.round((userData.trafficUsed / userData.trafficLimit) * 100);
            document.getElementById('traffic-percent').innerText = percent + "%";
            document.getElementById('traffic-text').innerText = userData.trafficUsed + " МБ / " + userData.trafficLimit + " ГБ";
            document.getElementById('traffic-bar').style.width = percent + "%";
            
            document.getElementById('ref-count').innerText = userData.refCount;
            if (userData.hasCoupon) {
                document.getElementById('coupon-card').style.display = 'block';
            }
        });

        function showTab(tabName) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function applyPromo() {
            let code = document.getElementById('promo-input').value;
            if(code) sendCommandToBot('promo', {code: code});
        }

        function sendSupport() {
            let text = document.getElementById('support-text').value;
            if(text) sendCommandToBot('support', {text: text});
        }

        function copyLink() {
            const input = document.getElementById('ref-link');
            input.select();
            document.execCommand("copy");
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
